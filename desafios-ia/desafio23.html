<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Desafio 23</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Validação de Cadastro</h1>
        <small>Desafio 23 - IA</small>
    </header>

    <div class="conteiner-conteudo">
        <main class="main-simples">
            <section class="secao-saida">
                <p>Quantidade de <strong>Cadastros Válidos</strong>: </p>
                <input type="text" id="outQtdValidos" style="text-align: center; font-size: 24pt;" readonly>
                <p>Quantidade de <strong>Cadastros Inválidos</strong>: </p>
                <input type="text" id="outQtdInvalidos" style="text-align: center; font-size: 24pt;" readonly>
                <p>Relatório de <strong>Erros</strong>: </p>
                <pre id="outErros"></pre>
            </section>
        </main>
    </div>

    <script src="js/desafio23.js"></script>
</body>
</html>
