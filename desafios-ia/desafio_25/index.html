<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Desafio 25</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Biblioteca</h1>
        <small>Desafio 25 - IA</small>
    </header>

    <div class="conteiner-conteudo">
        <main class="main-simples">
            <section class="secao-saida">
                <h2>Relatórios de Empréstimos</h2>
                <label>Lista de Empréstimos</label>
                <pre id="outEmprestimos"></pre>
                <h3 style="margin: 25px 0px 10px 0px">Números:</h3>
                <p style="margin: 0px 0px 2px 10px;"><strong>- Qtd. Emprestimos Atrasados: </strong><span id="outQtdAtrasos"></span></p>
                <p style="margin: 0px 0px 2px 10px;"><strong>- Empréstimo com maior atraso: </strong><span id="outMaiorAtraso"></span></p>
                <p style="margin: 0px 0px 2px 10px;"><strong>- Qtd. Livros dentro do prazo: </strong><span id="outQtdNoPrazo"></span></p>
            </section>
        </main>
    </div>

    <script src="js/desafio25.js"></script>
</body>
</html>
