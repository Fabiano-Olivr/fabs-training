<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Desafio 24</title>
</head>
<body>
    <header class="cabecalho">
        <h1>Busca Inteligente de Produtos</h1>
        <small>Desafio 24 - IA</small>
    </header>

    <div class="conteiner-conteudo">
        <main class="main-simples">
            <section class="secao-saida">
                <section class="entrada-busca">
                    <form id="formulario-busca">
                        <p>
                            <input type="text" id="inBusca" placeholder="Buscar..." required style="width: 80%;">
                            <button type="submit" id="btBuscar">🔍</button>
                            <button type="button" id="btLimpar">Limpar Busca</button>
                        </p>
                    </form>
                </section>

                <section class="resultado-Busca" id="outResultado">
                    </section>
            </section>
        </main>
    </div>

    <script src="js/desafio24.js"></script>
</body>
</html>
